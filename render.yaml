services:
  # OpsMemory AI Unified Full-Stack Production Service
  - type: web
    name: opsmemory-ai
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run install:all && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: PORT
        value: 10000
      - key: HINDSIGHT_BANK_ID
        value: opsmemory-production
      - key: HINDSIGHT_URL
        value: http://localhost:8888
